name: Daily Build

on:
  schedule:
    - cron: '0 2 * * *'   # Every day at 02:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub UI

permissions:
  contents: write           # Needed to create/update the nightly release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # Linux: portable zip + .deb package
  # ─────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          BUILD_NUMBER=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -s -d'+' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev \
            libkeybinder-3.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Patch flutter_pty missing sys/wait.h
        run: |
          PTY_FILE=$(find "$HOME/.pub-cache" -name "flutter_pty_unix.c" 2>/dev/null | head -1)
          if [ -n "$PTY_FILE" ] && ! grep -q "sys/wait.h" "$PTY_FILE"; then
            sed -i '1s/^/#include <sys\/wait.h>\n/' "$PTY_FILE"
          fi

      - name: Build Linux release
        run: flutter build linux --release --no-tree-shake-icons

      # ── Portable zip ──────────────────────────
      - name: Create portable zip
        run: |
          cd build/linux/x64/release
          zip -r "../../../../fima-nightly-linux.zip" bundle/

      # ── .deb package ──────────────────────────
      - name: Build .deb package
        run: ./linux/packaging/build_deb.sh "fima-nightly.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            fima-nightly-linux.zip
            fima-nightly.deb
          retention-days: 30

  # ─────────────────────────────────────────────
  # Windows: portable zip + Inno Setup installer
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          $match = (Get-Content pubspec.yaml | Select-String -Pattern '^version:\s*([^\s+]+)(?:\+([^\s]+))?').Matches[0]
          $ver = $match.Groups[1].Value
          $build = $match.Groups[2].Value
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "build_number=$build" >> $env:GITHUB_OUTPUT
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV
        shell: powershell

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --no-tree-shake-icons

      # ── Portable zip ──────────────────────────
      - name: Create portable zip
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath "fima-nightly-windows.zip"
        shell: powershell

      # ── Inno Setup installer ──────────────────
      - name: Install Inno Setup
        run: choco install innosetup --yes
        shell: powershell

      - name: Build installer
        run: |
          powershell -ExecutionPolicy Bypass -File windows/build_installer.ps1 -OutputFile "fima-nightly-setup.exe"
        shell: powershell

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            fima-nightly-windows.zip
            fima-nightly-setup.exe
          retention-days: 30

  # ─────────────────────────────────────────────
  # macOS: portable zip + DMG
  # ─────────────────────────────────────────────
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          BUILD_NUMBER=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -s -d'+' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release --no-tree-shake-icons
        env:
          EXPANDED_CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"

      # ── Portable zip ──────────────────────────
      - name: Create portable zip
        run: |
          cd build/macos/Build/Products/Release
          zip -r "../../../../../fima-nightly-macos.zip" fima.app

      # ── DMG ───────────────────────────────────
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: ./macos/packaging/build_dmg.sh "fima-nightly.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            fima-nightly-macos.zip
            fima-nightly.dmg
          retention-days: 30

  # ─────────────────────────────────────────────
  # Publish: single job — runs after all 3 builds
  # succeed, uploads everything to nightly release
  # in one API call (no race condition)
  # ─────────────────────────────────────────────
  publish-release:
    name: Publish Nightly Release
    runs-on: ubuntu-24.04
    needs: [build-linux, build-windows, build-macos]

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Remove stale assets from nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release view nightly --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if [ -n "$asset" ]; then
                echo "Deleting old asset: $asset"
                gh release delete-asset nightly "$asset" --repo "${{ github.repository }}" --yes || true
              fi
            done
          fi

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build (v${{ steps.version.outputs.version }})"
          prerelease: true
          body: |
            Automated daily build — version ${{ steps.version.outputs.version }} (run ${{ github.run_id }})

            | Platform | Portable | Installer |
            |----------|----------|-----------|
            | Linux    | `fima-nightly-linux.zip` | `fima-nightly.deb` |
            | Windows  | `fima-nightly-windows.zip` | `fima-nightly-setup.exe` |
            | macOS    | `fima-nightly-macos.zip` | `fima-nightly.dmg` |
          files: |
            artifacts/*
